<svg xmlns="http://www.w3.org/2000/svg" width="880" height="530" viewBox="0 0 880 530" role="img" aria-labelledby="title description">
  <title id="title">Cloud Security Capability Stack</title>
  <desc id="description">Six grouped capability areas from the public profile: cloud platforms; cloud security; DevSecOps and Infrastructure as Code; detection and monitoring; governance and compliance context; and security automation. AI-assisted incident triage is a learning focus. Framework references do not represent organizational compliance or attestation.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    .card { fill: #161b22; stroke: #364152; }
    .heading { fill: #79c0ff; font-size: 20px; font-weight: 600; }
    .body { fill: #e6edf3; font-size: 17px; }
    .note { fill: #b1bac4; font-size: 15px; }
  </style>
  <rect width="880" height="530" rx="12" fill="#0d1117"/>
  <g transform="translate(16 16)">
    <rect class="card" width="416" height="148" rx="8"/>
    <text class="heading" x="20" y="32">Cloud Platforms</text>
    <text class="body" x="20" y="63">AWS · Microsoft Azure · Google Cloud</text>
    <text class="body" x="20" y="91">Multi-account architecture</text>
    <text class="body" x="20" y="119">Multi-cloud security</text>
  </g>
  <g transform="translate(448 16)">
    <rect class="card" width="416" height="148" rx="8"/>
    <text class="heading" x="20" y="32">Cloud Security</text>
    <text class="body" x="20" y="63">IAM · Entra ID · Azure RBAC · Zero Trust</text>
    <text class="body" x="20" y="91">OIDC · Federation · Boundaries · SCPs</text>
    <text class="body" x="20" y="119">Network security · WAF · Cloud Armor</text>
  </g>
  <g transform="translate(16 180)">
    <rect class="card" width="416" height="148" rx="8"/>
    <text class="heading" x="20" y="32">DevSecOps / IaC</text>
    <text class="body" x="20" y="63">Terraform · Infrastructure as Code</text>
    <text class="body" x="20" y="91">Policy as code · Git · GitHub Actions</text>
    <text class="body" x="20" y="119">Validation · Remediation · Revalidation</text>
  </g>
  <g transform="translate(448 180)">
    <rect class="card" width="416" height="148" rx="8"/>
    <text class="heading" x="20" y="32">Detection / Monitoring</text>
    <text class="body" x="20" y="63">CloudTrail · GuardDuty · EventBridge</text>
    <text class="body" x="20" y="91">Audit logging · Investigation</text>
    <text class="body" x="20" y="119">Incident response engineering</text>
  </g>
  <g transform="translate(16 344)">
    <rect class="card" width="416" height="148" rx="8"/>
    <text class="heading" x="20" y="32">Governance / Compliance Context</text>
    <text class="body" x="20" y="63">Governance controls · NIST · ISO 27001</text>
    <text class="body" x="20" y="91">HIPAA/HITRUST-aligned engineering</text>
    <text class="body" x="20" y="119">PCI DSS · SOC 2 · Engineering evidence</text>
  </g>
  <g transform="translate(448 344)">
    <rect class="card" width="416" height="148" rx="8"/>
    <text class="heading" x="20" y="32">AI / Security Automation</text>
    <text class="body" x="20" y="63">Security automation · Git workflows</text>
    <text class="body" x="20" y="91">AI-assisted incident triage: learning</text>
    <text class="body" x="20" y="119">Bedrock integration: planned project work</text>
  </g>
  <text class="note" x="24" y="516">Frameworks describe engineering context, not organizational compliance or attestation.</text>
</svg>
